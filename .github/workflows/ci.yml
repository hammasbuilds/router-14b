name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No dataset download, no model, no GPU. Tests that need the fetched corpus skip
    # when it is absent, so this runs the logic tests only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest ruff==0.16.7
      - run: ruff check .
      - run: ruff format --check .
      # Every test reads the 57,477-vote Arena corpus, which CI does not download, so the
      # suite skips as a whole here (pytest exit 5, "no tests ran") and CI checks the
      # package installs, imports and lints. Run scripts/fetch_data.py for the real suite.
      - run: python -m pytest -q || [ $? -eq 5 ]
        shell: bash
